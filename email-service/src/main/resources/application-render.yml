server:
  port: ${PORT:9091}

spring:
  application:
    name: email-service

  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

logging:
  level:
    com.zukunftai.evidyalaya: INFO