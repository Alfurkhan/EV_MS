server:
  port: 9091

email:
  app-base-url: ${EMAIL_APP_BASE_URL:http://localhost:5173}
  service:
    api-key: ${EMAIL_SERVICE_API_KEY:}

spring:
  application:
    name: email-service

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        enabled: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always