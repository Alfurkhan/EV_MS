name: Timetable workflow validation

on:
  pull_request:
    branches:
      - deployment/aws-dev
      - feature/faculty-timetable-approval
      - feature/assignments
      - feature/evidyalaya-final-development
  push:
    branches:
      - feature/faculty-timetable-approval
      - feature/assignments
      - feature/assignment-ux-enhancements
      - feature/evidyalaya-final-development
      - feature/notification-foundation
      - feature/notification-admin-oversight

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend TypeScript and Vite build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-build:
    name: Backend Gradle build and PostgreSQL migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: evidyalaya_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evidyalaya_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASSESSMENT_MIGRATION_TEST_URL: jdbc:postgresql://localhost:5432/evidyalaya_migration_test
      ASSESSMENT_MIGRATION_TEST_USERNAME: postgres
      ASSESSMENT_MIGRATION_TEST_PASSWORD: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build backend services
        run: ./gradlew build
