server:
  port: ${PORT:9095}

spring:
  application:
    name: api-gateway

  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false

    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true

            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "${CORS_ORIGIN:http://localhost:5173}"

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH

                allowedHeaders:
                  - "*"

                allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      jwtExpirationInMs: ${JWT_EXPIRATION:86400000}

endpoint:
  user-service: ${USER_SERVICE_URL:http://localhost:8080}